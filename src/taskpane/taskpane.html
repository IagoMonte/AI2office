<!DOCTYPE html>

<html>

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AI2Office</title>

    <!-- Office.js evergreen (inclui ExcelApi/WordApi 1.8+) -->
    <script type="text/javascript" src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    <link rel="stylesheet" href="https://static2.sharepointonline.com/files/fabric/office-ui-fabric-core/11.0.0/css/fabric.min.css"/>
    <link rel="stylesheet" href="taskpane.css" />
</head>

<body class="ms-font-m ms-welcome ms-Fabric">
    <div class="app-container">
        <header class="app-header">
            <div class="header-content">
                <h1 class="ms-font-xl header-title">AI2Office</h1>
                <button id="settingsBtn" class="settings-btn" title="Configurações">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="3"></circle>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                    </svg>
                </button>
            </div>
        </header>

        <div id="chatView" class="chat-view">
            <div id="chatMessages" class="chat-messages">
                <div class="welcome-message">
                    <h2 class="ms-font-l">Bem-vindo ao AI2Office</h2>
                    <p class="ms-font-s">Configure sua API nas configurações e comece a conversar.</p>
                </div>
            </div>

            <div class="model-selector">
                <select id="modelSelect" class="model-select">
                    <option value="" disabled selected>Carregando modelos...</option>
                </select>
                <button id="refreshModelsBtn" class="refresh-models-btn" title="Atualizar modelos">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="23 4 23 10 17 10"></polyline>
                        <polyline points="1 20 1 14 7 14"></polyline>
                        <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
                    </svg>
                </button>
            </div>

            <div id="attachmentChips" class="attachment-chips hidden"></div>

            <div class="chat-input-container">
                <input type="file" id="fileInput" class="hidden" multiple accept=".xlsx,.xls,.csv,.txt,.pdf,.docx" />
                <button id="attachBtn" class="attach-btn" title="Anexar arquivo (.xlsx, .csv, .pdf, .docx...)">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path>
                    </svg>
                </button>
                <textarea id="chatInput" class="chat-input" placeholder="Digite sua mensagem..." rows="3"></textarea>
                <button id="sendBtn" class="send-btn" disabled>
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                </button>
            </div>
        </div>

        <div id="settingsView" class="settings-view hidden">
            <div class="settings-content">
                <div class="settings-header">
                    <h2 class="ms-font-l">Configurações da API</h2>
                    <button id="closeSettingsBtn" class="close-btn">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="18" y1="6" x2="6" y2="18"></line>
                            <line x1="6" y1="6" x2="18" y2="18"></line>
                        </svg>
                    </button>
                </div>

                <form id="settingsForm" class="settings-form">
                    <div class="form-group">
                        <label class="ms-font-s" for="apiEndpoint">Endpoint da API</label>
                        <input type="text" id="apiEndpoint" class="form-input" placeholder="https://api.openai.com/v1/chat/completions" />
                    </div>

                    <div class="form-group">
                        <label class="ms-font-s" for="apiKey">Chave da API</label>
                        <div class="input-with-toggle">
                            <input type="password" id="apiKey" class="form-input" placeholder="sk-..." />
                            <button type="button" id="toggleKeyBtn" class="toggle-btn">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">Salvar</button>
                    </div>
                </form>
            </div>
        </div>

        <div id="dropOverlay" class="drop-overlay hidden">
            <div class="drop-overlay-box">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="7 10 12 15 17 10"></polyline>
                    <line x1="12" y1="15" x2="12" y2="3"></line>
                </svg>
                <span>Solte os arquivos para anexar</span>
                <small>.xlsx · .csv · .txt · .pdf · .docx</small>
            </div>
        </div>
    </div>

    <script src="taskpane.js"></script>
</body>

</html>
